# À COPIER dans .github/workflows/ (droit « workflow » requis pour le pousser).
# KOINO SIGN : construit l'image Docker de la branche koino et la publie sur
# GitHub Container Registry (ghcr.io/maxencemrn/koino-sign), où le serveur la
# récupère (deploy/koino-sign/mettre-a-jour.sh). Les workflows de Documenso
# (tests, traductions, publication Docker Hub) ne tournent pas sur ce fork.
name: Image KOINO SIGN

on:
  push:
    branches: [koino]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: koino-sign-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/koino-sign
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short
          labels: |
            org.opencontainers.image.title=KOINO SIGN
            org.opencontainers.image.description=Signature électronique de Koïno, fork de Documenso (AGPL-3.0)
            org.opencontainers.image.licenses=AGPL-3.0

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
